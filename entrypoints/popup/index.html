<!doctype html>
<!--
  @file entrypoints/popup/index.html
  文件职责：提供浏览器工具栏 popup 的最小 HTML 外壳。
  主要内容：声明中文与 browser_action 元数据，在外部样式和脚本到达前固定首屏尺寸与图形等待状态；用独立无框架脚本提前唤醒后台，与应用模块加载并行。
  模块边界：预唤醒只返回引导状态提示，不读取配置快照或当前标签页，渲染与所有交互由 popup Vue 应用完成。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>流畅阅读</title>
    <meta name="manifest.type" content="browser_action" />
    <meta name="manifest.title" content="__MSG_extensionName__" />
    <style>
      /* 工具栏先按文档内容定尺寸；关键样式必须早于后台唤醒及外部 CSS。 */
      html { width: var(--interface-popup-width, 320px); min-height: 460px; background: #fff; }
      body, #app { width: var(--fluentread-localized-popup-width, var(--interface-popup-width, 320px)); margin: 0; }
      .popup-startup { box-sizing: border-box; min-height: 460px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 20px; }
      .popup-startup i { width: 12px; height: 12px; border: 1.5px solid #d4d8e1; border-top-color: #737c8f; border-radius: 50%; }
    </style>
    <script src="/popup-startup.js"></script>
  </head>
  <body class="popup-page" style="margin: 0;">
    <div id="app">
      <div class="popup-startup" role="status" aria-busy="true" aria-label="流畅阅读">
        <img src="/icon/128.png" alt="" width="24" height="24" />
        <i aria-hidden="true"></i>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
