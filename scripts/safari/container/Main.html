<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FluentRead</title>
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
<main>
    <header><img src="../Icon.png" width="56" height="56" alt=""><div><h1>FluentRead</h1><p id="subtitle">Translate in Safari</p></div></header>

    <ol><li id="step-enable"></li><li id="step-access"></li><li id="step-use"></li></ol>
    <button id="open-settings" type="button" hidden></button>

    <p id="status" role="status" aria-live="polite"></p>

</html>
